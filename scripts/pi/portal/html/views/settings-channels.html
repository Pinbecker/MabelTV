<section id="view-settings-channels" class="view"><div class="page settings-page settings-detail-page">
  <button type="button" class="appearance-back settings-back" data-go="settings-mabel"><svg class="icon" aria-hidden="true"><use href="/portal/icons.svg#signal-arrow-left"/></svg><span data-tv-name>Your TV</span></button>
  <header class="settings-page-title"><p class="eyebrow">Channel settings</p><h1>Channels and numbers</h1><p>Use the arrows to move channels up or down.</p></header>
  <div class="channel-numbers-heading"><span id="channelNumbersCount"></span><button id="channelNumbersAdd" type="button" class="settings-submit secondary"><svg class="icon"><use href="/portal/icons.svg#signal-plus"/></svg><span>New channel</span></button></div>
  <p class="settings-hint">Numbers follow the list order and save automatically. Every channel keeps its programmes and settings.</p>
  <p id="channelNumbersFeedback" class="channel-numbers-feedback" role="status"></p>
  <div id="channelNumbersList" class="channel-numbers-list"></div>
  <footer><span data-tv-name>Your TV</span> · Channel settings</footer>
</div></section>
