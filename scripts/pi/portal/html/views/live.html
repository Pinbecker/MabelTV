      <section id="view-live" class="view"><div class="page live-page">
        <div class="tv-remote-toolbar">
          <div class="remote-feedback" aria-live="polite"><span id="remoteConnectionDot" class="live-led off"></span><span id="remoteFeedback">Connecting</span></div>
          <nav class="tv-remote-switcher" aria-label="Choose remote control">
            <button type="button" class="active" data-go="live" aria-current="page">MabelTV</button>
            <button type="button" data-go="lg-tv">LG TV</button>
          </nav>
        </div>
        <header class="screen-title live-title"><div><p class="eyebrow">Control what is on the television</p><h1>Remote</h1></div></header>

        <section class="tv-remote-status-card mabel-status-card" aria-label="MabelTV status and live television preview">
          <div class="tv-remote-status-visual mabel-live-visual">
            <div class="live-screen"><video id="liveVideo" muted autoplay playsinline preload="none"></video><img id="liveMjpeg" class="hidden" alt="Live MabelTV picture"><div id="liveOff" class="live-off"><strong id="liveOffTitle">Connecting…</strong><span id="liveOffText">Preparing the live picture</span></div></div>
            <button id="toggleLivePreview" class="mabel-live-toggle" type="button" aria-label="Expand live TV preview" aria-expanded="false"><span><svg><use href="/portal/icons.svg#signal-maximize"/></svg></span></button>
          </div>
          <div class="tv-remote-status-copy">
            <p class="tv-remote-status-kicker">MabelTV</p>
            <h2 id="liveProgramme">Waiting for MabelTV</h2>
            <p id="liveChannel" class="tv-remote-status-detail">Live preview</p>
            <div class="tv-remote-status-facts">
              <span><i id="remoteMabelTvLed" class="portal-power-status-dot is-unknown"></i><b>MabelTV</b> <em id="remoteMabelTvText">Checking…</em></span>
              <span><i id="remoteConnectedTvLed" class="portal-power-status-dot is-unknown"></i><b>Connected TV</b> <em id="remoteConnectedTvText">Checking…</em></span>
            </div>
          </div>
          <div class="tv-remote-card-actions">
            <button id="openRemotePower" class="tv-remote-card-button tv-remote-card-power" type="button" aria-label="MabelTV power options"><svg><use href="/portal/icons.svg#signal-power"/></svg></button>
            <button id="remoteLock" class="tv-remote-card-button tv-remote-card-lock" type="button" data-live-command="toggle-remote-lock" aria-label="Lock kids’ physical remote"><svg><use href="/portal/icons.svg#signal-lock"/></svg></button>
          </div>
        </section>

        <section class="remote-app" aria-label="MabelTV remote control">
          <div class="tv-remote-chassis">
            <div class="tv-remote-control-row">
              <div class="tv-remote-rocker tv-remote-channel-rocker" aria-label="Channel controls"><button type="button" data-live-command="channel-up" aria-label="Channel up"><svg><use href="/portal/icons.svg#signal-plus"/></svg></button><span class="tv-remote-rocker-state"><svg><use href="/portal/icons.svg#signal-tv"/></svg><strong>CH</strong></span><button type="button" data-live-command="channel-down" aria-label="Channel down"><svg><use href="/portal/icons.svg#signal-minus"/></svg></button></div>

              <div class="tv-remote-dpad" aria-label="Directional controls"><button type="button" class="tv-dpad-up" data-live-command="navigate-up" aria-label="Up"><svg><use href="/portal/icons.svg#signal-chevron-up"/></svg></button><button type="button" class="tv-dpad-left" data-live-command="navigate-left" aria-label="Left"><svg><use href="/portal/icons.svg#signal-chevron-left"/></svg></button><button type="button" class="tv-dpad-ok" data-live-command="select">OK</button><button type="button" class="tv-dpad-right" data-live-command="navigate-right" aria-label="Right"><svg><use href="/portal/icons.svg#signal-chevron-right"/></svg></button><button type="button" class="tv-dpad-down" data-live-command="navigate-down" aria-label="Down"><svg><use href="/portal/icons.svg#signal-chevron-down"/></svg></button></div>

              <div class="tv-remote-rocker tv-remote-volume-rocker" aria-label="Volume controls"><button type="button" data-live-command="volume-up" aria-label="Volume up"><svg><use href="/portal/icons.svg#signal-plus"/></svg></button><button type="button" id="remoteMute" class="tv-remote-rocker-state tv-remote-mute" data-live-command="toggle-mute" aria-label="Mute" aria-pressed="false"><svg class="tv-remote-volume-on"><use href="/portal/icons.svg#signal-volume"/></svg><svg class="tv-remote-volume-off"><use href="/portal/icons.svg#signal-volume-x"/></svg></button><button type="button" data-live-command="volume-down" aria-label="Volume down"><svg><use href="/portal/icons.svg#signal-minus"/></svg></button></div>
            </div>
            <button id="remoteBack" type="button" class="tv-remote-back" data-live-command="close-overlay"><svg><use href="/portal/icons.svg#signal-arrow-left"/></svg><span>Back</span></button>
            <div class="tv-remote-utility-row remote-destinations" aria-label="MabelTV shortcuts">
              <button type="button" class="remote-mode remote-mode-mabel" data-live-command="return-to-mabeltv" id="remoteMabelAction"><svg><use href="/portal/icons.svg#signal-tv"/></svg><span>MabelTV</span></button>
              <button type="button" class="remote-mode remote-mode-guide" data-live-command="open-channel-menu"><svg><use href="/portal/icons.svg#signal-list-filter"/></svg><span>Channels</span></button>
              <button type="button" class="remote-mode remote-mode-menu" data-live-command="open-parent-menu"><svg><use href="/portal/icons.svg#signal-settings"/></svg><span>Parent menu</span></button>
              <button type="button" class="remote-mode remote-mode-adult" data-live-command="enter-adult-mode" id="remoteAdultAction"><svg><use href="/portal/icons.svg#signal-monitor-play"/></svg><span>Open Adult TV</span></button>
            </div>
          </div>

          <section class="remote-playback" aria-label="Programme controls">
            <div class="tv-remote-transport-row" aria-label="Playback controls">
              <button type="button" data-live-command="previous-programme" aria-label="Previous programme"><svg><use href="/portal/icons.svg#signal-rewind"/></svg></button>
              <div class="tv-remote-play-pause">
                <button type="button" id="remotePlay" data-live-command="toggle-pause" aria-label="Play" disabled><svg><use href="/portal/icons.svg#signal-play"/></svg></button>
                <button type="button" id="remotePause" data-live-command="toggle-pause" aria-label="Pause" disabled><svg><use href="/portal/icons.svg#signal-pause"/></svg></button>
              </div>
              <button type="button" data-live-command="next-programme" aria-label="Next programme"><svg><use href="/portal/icons.svg#signal-fast-forward"/></svg></button>
            </div>
            <div class="remote-transport remote-transport-context">
              <button type="button" data-live-command="restart-programme"><svg><use href="/portal/icons.svg#signal-restart"/></svg><span>Restart</span></button>
              <button type="button" id="remoteSubtitles" data-live-command="toggle-subtitles"><svg><use href="/portal/icons.svg#signal-captions"/></svg><span>Subtitles</span></button>
              <button type="button" id="remoteWidescreen" data-live-command="toggle-widescreen-mode" aria-pressed="false"><svg><use href="/portal/icons.svg#signal-maximize"/></svg><span>Widescreen</span></button>
              <button type="button" id="remoteAdultHandoff" data-live-command="continue-in-adult-mode"><svg><use href="/portal/icons.svg#signal-monitor-play"/></svg><span>Open in Adult TV</span></button>
            </div>
          </section>
        </section>
        <footer><span data-tv-name>Your TV</span> · Live preview stays on your home network</footer>
      </div></section>
