      <section id="view-live" class="view"><div class="page live-page">
        <header class="screen-title live-title"><div><p class="eyebrow">Control what is on the television</p><h1>Remote</h1></div><div class="remote-feedback" aria-live="polite"><span id="remoteConnectionDot" class="live-led off"></span><span id="remoteFeedback">Connecting</span></div></header>

        <section class="live-preview" aria-label="Live television preview">
          <div class="live-screen"><video id="liveVideo" muted autoplay playsinline preload="none"></video><img id="liveMjpeg" class="hidden" alt="Live MabelTV picture"><div id="liveOff" class="live-off"><strong id="liveOffTitle">Connecting to the TV…</strong><span id="liveOffText">Preparing the live picture</span></div></div>
          <div class="live-now"><div><span id="liveChannel">Live preview</span><strong id="liveProgramme">Waiting for MabelTV</strong></div><small><span id="liveLed" class="live-led off"></span><span id="liveState">Checking…</span></small></div>
        </section>

        <section class="remote-app" aria-label="MabelTV remote control">
          <div class="remote-destinations" aria-label="TV destinations">
            <button type="button" class="remote-mode" data-live-command="return-to-mabeltv" id="remoteMabelAction"><span class="remote-mode-icon"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="11" rx="2"/><path d="m9 3 3 4 3-4"/></svg></span><span>MabelTV</span></button>
            <button type="button" class="remote-mode" data-live-command="open-tv-guide"><span class="remote-mode-icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18M8 5v15M12 13h5"/></svg></span><span>Guide</span></button>
            <button type="button" class="remote-mode" data-live-command="open-parent-menu"><span class="remote-mode-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.5 1A7 7 0 0 0 14.3 5L14 2h-4l-.4 3A7 7 0 0 0 7.5 7L5 6 3 9.3l2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.5-1a7 7 0 0 0 2.1 1.9l.4 3h4l.4-3a7 7 0 0 0 2.1-1.9l2.5 1 2-3.4-2-1.5c0-.4.1-.8.1-1.2Z"/></svg></span><span>Menu</span></button>
            <button type="button" class="remote-mode" data-live-command="enter-adult-mode" id="remoteAdultAction"><span class="remote-mode-icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3Z"/></svg></span><span>Adult TV</span></button>
          </div>

          <div class="remote-core">
            <div class="remote-side-column">
              <div class="remote-rocker" aria-label="Channel controls"><button type="button" data-live-command="channel-up" aria-label="Channel up"><svg viewBox="0 0 24 24"><path d="M12 7v10M7 12h10"/></svg></button><span><small>Channel</small><strong>CH</strong></span><button type="button" data-live-command="channel-down" aria-label="Channel down"><svg viewBox="0 0 24 24"><path d="M7 12h10"/></svg></button></div>
            </div>

            <div class="remote-centre">
              <button id="remoteBack" type="button" class="remote-back" data-live-command="close-overlay"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7M8 12h11"/></svg><span>Back</span></button>
              <div class="remote-pad" aria-label="Directional controls"><span class="remote-pad-ring" aria-hidden="true"></span><button type="button" class="up" data-live-command="navigate-up" aria-label="Up"><svg viewBox="0 0 24 24"><path d="m7 15 5-6 5 6"/></svg></button><button type="button" class="left" data-live-command="navigate-left" aria-label="Left"><svg viewBox="0 0 24 24"><path d="m15 7-6 5 6 5"/></svg></button><button type="button" class="select" data-live-command="select"><span>OK</span></button><button type="button" class="right" data-live-command="navigate-right" aria-label="Right"><svg viewBox="0 0 24 24"><path d="m9 7 6 5-6 5"/></svg></button><button type="button" class="down" data-live-command="navigate-down" aria-label="Down"><svg viewBox="0 0 24 24"><path d="m7 9 5 6 5-6"/></svg></button></div>
            </div>

            <div class="remote-side-column">
              <div class="remote-rocker" aria-label="Volume controls"><button type="button" data-live-command="volume-up" aria-label="Volume up"><svg viewBox="0 0 24 24"><path d="M12 7v10M7 12h10"/></svg></button><button type="button" id="remoteMute" class="remote-rocker-state" data-live-command="toggle-mute" aria-label="Mute"><small>Volume</small><strong id="remoteVolumeValue">—</strong></button><button type="button" data-live-command="volume-down" aria-label="Volume down"><svg viewBox="0 0 24 24"><path d="M7 12h10"/></svg></button></div>
            </div>
          </div>

          <section class="remote-playback" aria-label="Programme controls"><header><span>Programme</span><span id="remotePlaybackState" class="remote-state-pill">Live</span></header><div class="remote-transport">
            <button type="button" data-live-command="previous-programme"><svg viewBox="0 0 24 24"><path d="M7 6v12M18 7l-8 5 8 5Z"/></svg><span>Previous</span></button>
            <button type="button" data-live-command="restart-programme"><svg viewBox="0 0 24 24"><path d="M5 8V3m0 0h5M5 3l3.5 3.5A8 8 0 1 1 4 13"/></svg><span>Restart</span></button>
            <button type="button" id="remotePlayPause" class="remote-play" data-live-command="toggle-pause"><svg class="remote-pause-icon" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg><svg class="remote-play-icon" viewBox="0 0 24 24"><path d="m9 6 9 6-9 6Z"/></svg><span id="remotePlayPauseLabel">Pause</span></button>
            <button type="button" id="remoteSubtitles" data-live-command="toggle-subtitles"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 11h4M7 14h6M15 11h2M15 14h2"/></svg><span>Subtitles</span></button>
            <button type="button" data-live-command="next-programme"><svg viewBox="0 0 24 24"><path d="M17 6v12M6 7l8 5-8 5Z"/></svg><span>Next</span></button>
          </div></section>

          <footer class="remote-dock"><button id="openLiveChannels" type="button" class="remote-dock-main"><span class="remote-dock-icon"><svg viewBox="0 0 24 24"><path d="M5 5h14M5 12h14M5 19h14"/><circle cx="8" cy="5" r="1"/><circle cx="14" cy="12" r="1"/><circle cx="10" cy="19" r="1"/></svg></span><span><small>Channel</small><strong id="remoteChannelPickerLabel">Choose a channel</strong></span><svg class="remote-dock-chevron" viewBox="0 0 24 24"><path d="m9 7 5 5-5 5"/></svg></button><button id="remoteLock" type="button" class="remote-dock-action" data-live-command="toggle-remote-lock" aria-label="Lock kids’ physical remote"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span>Lock kids</span></button><button id="openRemotePower" type="button" class="remote-dock-action remote-power"><svg viewBox="0 0 24 24"><path d="M12 3v9M6.6 6.6a7.5 7.5 0 1 0 10.8 0"/></svg><span>Power</span></button></footer>
        </section>
        <footer><span data-tv-name>Your TV</span> · Live preview stays on your home network</footer>
      </div></section>
