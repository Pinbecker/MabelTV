      <section id="view-live" class="view"><div class="page live-page">
        <div class="tv-remote-toolbar">
          <div class="remote-feedback" aria-live="polite"><span id="remoteConnectionDot" class="live-led off"></span><span id="remoteFeedback">Connecting</span></div>
          <nav class="tv-remote-switcher" aria-label="Choose remote control">
            <button type="button" class="active" data-go="live" aria-current="page">MabelTV</button>
            <button type="button" data-go="lg-tv">LG TV</button>
          </nav>
        </div>
        <header class="screen-title live-title"><div><p class="eyebrow">Control what is on the television</p><h1>Remote</h1></div></header>

        <section class="live-preview" aria-label="Live television preview">
          <div class="live-screen"><video id="liveVideo" muted autoplay playsinline preload="none"></video><img id="liveMjpeg" class="hidden" alt="Live MabelTV picture"><div id="liveOff" class="live-off"><strong id="liveOffTitle">Connecting to the TV…</strong><span id="liveOffText">Preparing the live picture</span></div></div>
          <div class="live-now"><div><span id="liveChannel">Live preview</span><strong id="liveProgramme">Waiting for MabelTV</strong></div><small><span id="liveLed" class="live-led off"></span><span id="liveState">Checking…</span></small></div>
        </section>

        <section class="remote-app" aria-label="MabelTV remote control">
          <div class="remote-destinations" aria-label="TV destinations">
            <button type="button" class="remote-mode remote-mode-mabel" data-live-command="return-to-mabeltv" id="remoteMabelAction"><span class="remote-mode-icon"><svg><use href="/portal/icons.svg#signal-tv"/></svg></span><span>MabelTV</span></button>
            <button type="button" class="remote-mode remote-mode-guide" data-live-command="open-channel-menu"><span class="remote-mode-icon"><svg><use href="/portal/icons.svg#signal-list-filter"/></svg></span><span>Channels</span></button>
            <button type="button" class="remote-mode remote-mode-menu" data-live-command="open-parent-menu"><span class="remote-mode-icon"><svg><use href="/portal/icons.svg#signal-settings"/></svg></span><span>Parent menu</span></button>
            <button type="button" class="remote-mode remote-mode-adult" data-live-command="enter-adult-mode" id="remoteAdultAction"><span class="remote-mode-icon"><svg><use href="/portal/icons.svg#signal-monitor-play"/></svg></span><span>Adult TV</span></button>
          </div>

          <div class="tv-remote-chassis">
            <div class="tv-remote-control-row">
              <div class="tv-remote-rocker tv-remote-channel-rocker" aria-label="Channel controls"><button type="button" data-live-command="channel-up" aria-label="Channel up"><svg><use href="/portal/icons.svg#signal-plus"/></svg></button><span class="tv-remote-rocker-state"><svg><use href="/portal/icons.svg#signal-tv"/></svg><strong>CH</strong></span><button type="button" data-live-command="channel-down" aria-label="Channel down"><svg><use href="/portal/icons.svg#signal-minus"/></svg></button></div>

              <div class="tv-remote-dpad" aria-label="Directional controls"><button type="button" class="tv-dpad-up" data-live-command="navigate-up" aria-label="Up"><svg><use href="/portal/icons.svg#signal-chevron-up"/></svg></button><button type="button" class="tv-dpad-left" data-live-command="navigate-left" aria-label="Left"><svg><use href="/portal/icons.svg#signal-chevron-left"/></svg></button><button type="button" class="tv-dpad-ok" data-live-command="select">OK</button><button type="button" class="tv-dpad-right" data-live-command="navigate-right" aria-label="Right"><svg><use href="/portal/icons.svg#signal-chevron-right"/></svg></button><button type="button" class="tv-dpad-down" data-live-command="navigate-down" aria-label="Down"><svg><use href="/portal/icons.svg#signal-chevron-down"/></svg></button></div>

              <div class="tv-remote-rocker tv-remote-volume-rocker" aria-label="Volume controls"><button type="button" data-live-command="volume-up" aria-label="Volume up"><svg><use href="/portal/icons.svg#signal-plus"/></svg></button><button type="button" id="remoteMute" class="tv-remote-rocker-state tv-remote-mute" data-live-command="toggle-mute" aria-label="Mute"><svg class="tv-remote-volume-on"><use href="/portal/icons.svg#signal-volume"/></svg><svg class="tv-remote-volume-off"><use href="/portal/icons.svg#signal-volume-x"/></svg><strong id="remoteVolumeValue">—</strong></button><button type="button" data-live-command="volume-down" aria-label="Volume down"><svg><use href="/portal/icons.svg#signal-minus"/></svg></button></div>
            </div>
            <button id="remoteBack" type="button" class="tv-remote-back" data-live-command="close-overlay"><svg><use href="/portal/icons.svg#signal-arrow-left"/></svg><span>Back</span></button>
          </div>

          <section class="remote-playback" aria-label="Programme controls">
            <header><span>Programme</span><span id="remotePlaybackState" class="remote-state-pill">Live</span></header>
            <div class="remote-transport remote-transport-primary">
              <button type="button" data-live-command="previous-programme"><svg><use href="/portal/icons.svg#signal-skip-back"/></svg><span>Previous</span></button>
              <button type="button" data-live-command="restart-programme"><svg><use href="/portal/icons.svg#signal-restart"/></svg><span>Restart</span></button>
              <button type="button" id="remotePlayPause" class="remote-play" data-live-command="toggle-pause"><svg class="remote-pause-icon"><use href="/portal/icons.svg#signal-pause"/></svg><svg class="remote-play-icon"><use href="/portal/icons.svg#signal-play"/></svg><span id="remotePlayPauseLabel">Pause</span></button>
              <button type="button" data-live-command="next-programme"><svg><use href="/portal/icons.svg#signal-skip-forward"/></svg><span>Next</span></button>
            </div>
            <div class="remote-transport remote-transport-context">
              <button type="button" id="remoteSubtitles" data-live-command="toggle-subtitles"><svg><use href="/portal/icons.svg#signal-captions"/></svg><span>Subtitles</span></button>
              <button type="button" id="remoteWidescreen" data-live-command="toggle-widescreen-mode" aria-pressed="false"><svg><use href="/portal/icons.svg#signal-maximize"/></svg><span>Widescreen</span></button>
              <button type="button" id="remoteAdultHandoff" class="hidden" data-live-command="continue-in-adult-mode"><svg><use href="/portal/icons.svg#signal-monitor-play"/></svg><span>Adult TV</span></button>
            </div>
          </section>

          <footer class="remote-dock"><button id="openLiveChannels" type="button" class="remote-dock-main"><span class="remote-dock-icon"><svg><use href="/portal/icons.svg#signal-list-filter"/></svg></span><span><small>Channel</small><strong id="remoteChannelPickerLabel">Choose a channel</strong></span><svg class="remote-dock-chevron"><use href="/portal/icons.svg#signal-chevron-right"/></svg></button><button id="remoteLock" type="button" class="remote-dock-action remote-lock" data-live-command="toggle-remote-lock" aria-label="Lock kids’ physical remote"><span class="remote-dock-action-icon"><svg><use href="/portal/icons.svg#signal-lock"/></svg></span><span class="remote-dock-action-label">Lock kids</span></button><button id="openRemotePower" type="button" class="remote-dock-action remote-power"><span class="remote-dock-action-icon"><svg><use href="/portal/icons.svg#signal-power"/></svg></span><span class="remote-dock-action-label">Power</span></button></footer>
        </section>
        <footer><span data-tv-name>Your TV</span> · Live preview stays on your home network</footer>
      </div></section>
