<section id="view-my-tv-studio" class="view"><div class="page my-tv-viewing-page studio-page">
  <header class="screen-title my-tv-viewing-title studio-title"><div><button type="button" class="view-back" data-go="my-tv-home"><svg class="icon"><use href="/portal/icons.svg#signal-arrow-left"/></svg><span>My TV</span></button><h1>Studio</h1><div class="studio-worker-strip"><span id="studioWorkerDot" class="studio-status-dot"></span><span id="studioWorkerState">Checking connection…</span></div></div><button id="studioConnection" class="my-tv-viewing-explore" type="button" aria-label="Studio connections"><svg class="icon"><use href="/portal/icons.svg#signal-input"/></svg><span>Connections</span></button></header>
  <nav class="my-tv-viewing-tabs studio-tabs" aria-label="Studio sections"><button type="button" data-studio-tab="cloud" class="active">iCloud library</button><button type="button" data-studio-tab="iplayer">BBC iPlayer</button><button type="button" data-studio-tab="torrents">Find anything</button><button type="button" data-studio-tab="activity">Activity <span id="studioActiveCount"></span></button></nav>
  <p id="studioError" class="studio-error hidden" role="alert"></p>
  <section id="studioCloudPane" class="studio-pane">
    <div class="studio-cloud-search"><label class="portal-search my-tv-viewing-search"><svg class="icon"><use href="/portal/icons.svg#signal-search"/></svg><input id="studioCloudSearch" type="search" autocomplete="off" placeholder="Search your iCloud media" aria-label="Search iCloud media"></label><button id="studioCloudSelect" type="button" class="studio-button compact">Select</button></div>
    <div class="studio-cloud-tools"><label class="my-tv-viewing-select"><span class="sr-only">Library section</span><select id="studioCloudCategory" aria-label="Library section"><option value="films">Films</option><option value="tv">TV</option><option value="kids">Kids</option></select><svg class="icon studio-select-chevron"><use href="/portal/icons.svg#signal-chevron-down"/></svg></label><label class="my-tv-viewing-select"><span class="sr-only">Sort library</span><select id="studioCloudSort" aria-label="Sort library"><option value="name-asc">A to Z</option><option value="name-desc">Z to A</option><option value="size-desc">Largest first</option><option value="size-asc">Smallest first</option><option value="date-desc">Newest releases</option><option value="date-asc">Oldest releases</option></select><svg class="icon studio-select-chevron"><use href="/portal/icons.svg#signal-chevron-down"/></svg></label></div>
    <p id="studioManagerProgress" class="studio-caption hidden" role="status"></p>
    <p id="studioCloudStatus" class="studio-caption" role="status"></p><div id="studioCloudGrid" class="studio-cloud-grid my-tv-viewing-grid is-grid"></div><button id="studioCloudMore" type="button" class="studio-button studio-more hidden">Show more files</button>
    <div id="studioCloudSelection" class="studio-selection hidden"><span id="studioCloudSelectionCount"></span><button id="studioCloudContinue" class="studio-button primary" type="button">Choose destination <svg class="icon"><use href="/portal/icons.svg#signal-arrow-right"/></svg></button></div>
  </section>
  <section id="studioIplayerPane" class="studio-pane hidden">
    <div class="studio-iplayer-intro"><span class="studio-bbc">BBC <b>iPlayer</b></span></div>
    <form id="studioIplayerSearchForm"><label class="portal-search my-tv-viewing-search"><svg class="icon"><use href="/portal/icons.svg#signal-search"/></svg><input id="studioIplayerSearch" type="search" autocomplete="off" placeholder="Programme name or BBC episode link" aria-label="Search BBC iPlayer"></label></form>
    <div class="studio-section-head"><p id="studioIplayerStatus" class="studio-caption" role="status"></p></div>
    <div id="studioIplayerGrid" class="studio-programme-grid"></div>
  </section>
  <section id="studioTorrentPane" class="studio-pane hidden">
    <form id="studioTorrentSearchForm"><label class="portal-search my-tv-viewing-search"><svg class="icon"><use href="/portal/icons.svg#signal-search"/></svg><input id="studioTorrentSearch" type="search" autocomplete="off" placeholder="Find a film or TV show" aria-label="Search downloads"></label></form>
    <p id="studioTorrentStatus" class="studio-caption" role="status"></p>
    <div id="studioTorrentResults" class="studio-torrent-results"></div>
  </section>
  <section id="studioActivityPane" class="studio-pane hidden"><div class="studio-section-head"><div><h2>Activity</h2></div><span id="studioJobCount" class="studio-caption"></span></div><div id="studioJobs" class="studio-jobs"></div></section>
</div></section>
