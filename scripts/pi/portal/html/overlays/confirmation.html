<dialog id="portalConfirmationSheet" class="library-sheet portal-confirmation" aria-labelledby="portalConfirmationTitle" aria-describedby="portalConfirmationMessage">
  <section class="library-sheet-panel">
    <div class="portal-confirmation-copy"><span class="portal-confirmation-icon"><svg class="icon" aria-hidden="true"><use href="/portal/icons.svg#signal-tv"/></svg></span><h2 id="portalConfirmationTitle"></h2><p id="portalConfirmationMessage"></p></div>
    <div class="portal-confirmation-actions"><button id="portalConfirmationAccept" type="button" class="primary">OK</button><button id="portalConfirmationCancel" type="button" class="secondary">Cancel</button></div>
  </section>
</dialog>
