<dialog id="subtitleSheet" class="library-sheet studio-sheet" aria-labelledby="subtitleHeading"><section class="library-sheet-panel">
  <header class="library-sheet-head"><div><p>Subtitles</p><h2 id="subtitleHeading"><span id="subtitleTitle"></span></h2></div><button id="subtitleClose" type="button" class="portal-sheet-close" aria-label="Close subtitles"><svg class="icon" aria-hidden="true"><use href="/portal/icons.svg#signal-x"/></svg></button></header>
  <div class="library-sheet-body"><div id="subtitleTracks" class="studio-episodes"></div><p id="subtitleMessage" role="status"></p><form id="subtitleSearchForm"><label for="subtitleQuery">Find subtitles</label><div class="portal-search"><svg class="icon" aria-hidden="true"><use href="/portal/icons.svg#signal-search"/></svg><input id="subtitleQuery" type="search" placeholder="Title or release" enterkeyhint="search"><button id="subtitleSearchButton" type="submit" class="studio-button compact">Find</button></div></form><div id="subtitleResults" class="watch-film-actions"></div></div>
</section></dialog>
