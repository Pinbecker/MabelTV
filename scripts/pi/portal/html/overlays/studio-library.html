<dialog id="studioCloudMatchSheet" class="library-sheet studio-sheet" aria-labelledby="studioCloudMatchTitle"><section class="library-sheet-panel">
  <header class="library-sheet-head"><h2 id="studioCloudMatchTitle">Change title match</h2><button id="studioCloudMatchClose" type="button" class="portal-sheet-close" aria-label="Close title matching"><svg class="icon" aria-hidden="true"><use href="/portal/icons.svg#signal-x"/></svg></button></header>
  <div class="library-sheet-body"><form id="studioCloudMatchForm"><label class="portal-search"><svg class="icon" aria-hidden="true"><use href="/portal/icons.svg#signal-search"/></svg><input id="studioCloudMatchSearch" type="search" aria-label="Find film or TV series" autocomplete="off"><button type="submit" aria-label="Search title metadata">Search</button></label></form><p id="studioCloudMatchStatus" class="studio-caption" role="status"></p><div id="studioCloudMatchResults" class="studio-cloud-match-results studio-episodes"></div></div>
  <div class="studio-sheet-footer"><button id="studioCloudMatchUse" type="button" class="studio-button primary" disabled>Use title</button></div>
</section></dialog>
<dialog id="studioCloudDeleteSheet" class="library-sheet studio-sheet" aria-labelledby="studioCloudDeleteTitle"><section class="library-sheet-panel">
  <header class="library-sheet-head"><h2 id="studioCloudDeleteTitle">Delete from iCloud?</h2><button id="studioCloudDeleteClose" type="button" class="portal-sheet-close" aria-label="Close cloud deletion confirmation"><svg class="icon" aria-hidden="true"><use href="/portal/icons.svg#signal-x"/></svg></button></header>
  <div class="library-sheet-body"><p class="studio-notice"><svg class="icon" aria-hidden="true"><use href="/portal/icons.svg#signal-trash"/></svg><span>This removes the selected videos and subtitles from iCloud and synced devices. Copies on your TV are kept.</span></p><ul id="studioCloudDeleteNames" class="studio-delete-names"></ul><p id="studioCloudDeleteError" class="studio-error hidden" role="alert"></p></div>
  <div class="studio-sheet-footer"><button id="studioCloudDeleteCancel" type="button" class="studio-button">Keep items</button><button id="studioCloudDeleteConfirm" type="button" class="studio-button danger">Delete from iCloud</button></div>
</section></dialog>
<dialog id="studioCloudCollectionSheet" class="library-sheet studio-sheet" aria-labelledby="studioCloudCollectionTitle"><section class="library-sheet-panel">
  <header class="library-sheet-head"><h2 id="studioCloudCollectionTitle">Move to collection</h2><button id="studioCloudCollectionClose" type="button" class="portal-sheet-close" aria-label="Close iCloud collections"><svg class="icon" aria-hidden="true"><use href="/portal/icons.svg#signal-x"/></svg></button></header>
  <form id="studioCloudCollectionForm" class="library-sheet-body studio-auth-form">
    <select id="studioCloudMoveSelect" aria-label="iCloud collection" hidden></select><div id="studioCloudCollectionOptions" class="studio-episodes"></div>
    <label id="studioCloudNewCollection" class="hidden">Collection name<input id="studioCloudCollectionName" maxlength="80" autocomplete="off" aria-label="New iCloud collection"></label>
    <p id="studioCloudCollectionError" class="studio-error" role="alert"></p>
  </form>
  <div class="studio-sheet-footer"><button id="studioCloudCollectionCancel" type="button" class="studio-button">Cancel</button><button id="studioCloudCollectionSave" type="submit" form="studioCloudCollectionForm" class="studio-button primary">Move</button></div>
</section></dialog>
