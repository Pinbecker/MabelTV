<dialog id="studioCloudMatchSheet" class="library-sheet studio-sheet" aria-labelledby="studioCloudMatchTitle"><section class="library-sheet-panel"><header class="library-sheet-head"><div><h2 id="studioCloudMatchTitle">Match title</h2><p>Choose the right film or TV series.</p></div><button id="studioCloudMatchClose" type="button" class="portal-sheet-close" aria-label="Close title matching"><svg class="icon"><use href="/portal/icons.svg#signal-x"/></svg></button></header><div class="library-sheet-body"><form id="studioCloudMatchForm"><label class="portal-search"><svg class="icon"><use href="/portal/icons.svg#signal-search"/></svg><input id="studioCloudMatchSearch" type="search" aria-label="Find film or TV series" autocomplete="off"><button type="submit" class="studio-text-button" aria-label="Search title metadata"><svg class="icon"><use href="/portal/icons.svg#signal-search"/></svg></button></label></form><p id="studioCloudMatchStatus" class="studio-caption" role="status"></p><div id="studioCloudMatchResults" class="studio-cloud-match-results"></div></div></section></dialog>
<dialog id="studioCloudDeleteSheet" class="library-sheet studio-sheet" aria-labelledby="studioCloudDeleteTitle"><section class="library-sheet-panel"><header class="library-sheet-head"><div><h2 id="studioCloudDeleteTitle">Delete from iCloud?</h2></div><button id="studioCloudDeleteClose" type="button" class="portal-sheet-close" aria-label="Close cloud deletion confirmation"><svg class="icon"><use href="/portal/icons.svg#signal-x"/></svg></button></header><div class="library-sheet-body"><p class="studio-delete-explanation">The selected videos and their subtitles will be deleted from iCloud and your synced devices. Copies already on your Pi are kept.</p><ul id="studioCloudDeleteNames" class="studio-delete-names"></ul><p id="studioCloudDeleteError" class="studio-error hidden" role="alert"></p><div class="library-sheet-actions"><button id="studioCloudDeleteCancel" type="button" class="secondary">Keep items</button><button id="studioCloudDeleteConfirm" type="button" class="danger">Delete from iCloud</button></div></div></section></dialog>
