  <section id="app" class="app-shell hidden">
    <aside class="rail" aria-label="MabelTV portal">
      <div class="rail-brand">
        <img class="logo-mark" src="/mabeltv-icon.png" alt="">
        <div><strong>MabelTV</strong><span id="topTvName">Your TV</span></div>
      </div>
      <nav id="mainNav" class="portal-nav" aria-label="Main navigation">
        <button class="active" data-view-button="overview" aria-current="page"><svg class="icon"><use href="/portal/icons.svg#signal-house"/></svg><span>Home</span></button>
        <button data-view-button="watch"><svg class="icon"><use href="/portal/icons.svg#signal-clapperboard"/></svg><span>Watch</span></button>
        <button class="nav-remote" data-view-button="live"><svg class="icon"><use href="/portal/icons.svg#signal-radio"/></svg><span>Remote</span></button>
        <button data-view-button="insights"><svg class="icon"><use href="/portal/icons.svg#signal-chart-column"/></svg><span>Insights</span></button>
        <button data-view-button="system"><svg class="icon"><use href="/portal/icons.svg#signal-settings"/></svg><span>Settings</span></button>
      </nav>
      <div class="rail-foot">
        <span id="topHealth" class="health-pill">Checking MabelTV…</span>
        <button id="logout" class="rail-lock"><svg class="icon"><use href="/portal/icons.svg#signal-lock"/></svg><span>Lock parent portal</span></button>
      </div>
    </aside>

    <header class="mobile-head">
      <div class="mobile-brand"><img class="logo-mark" src="/mabeltv-icon.png" alt=""><strong>MabelTV</strong></div>
      <div class="mobile-head-actions">
        <button id="openHeaderAdultTv" class="mobile-header-adult" type="button" aria-label="Open Adult TV" title="Open Adult TV"><svg class="icon"><use href="/portal/icons.svg#signal-clapperboard"/></svg><span>Adult TV</span></button>
        <button id="openPortalPower" class="mobile-header-power" type="button" aria-label="MabelTV power options" title="MabelTV power options"><svg class="icon"><use href="/portal/icons.svg#signal-power"/></svg></button>
        <nav class="mobile-remote-switcher tv-remote-switcher" aria-label="Choose remote control">
          <button type="button" data-remote-switch="live" data-go="live">MabelTV</button>
          <button type="button" data-remote-switch="lg-tv" data-go="lg-tv">LG TV</button>
        </nav>
      </div>
    </header>

    <main class="app-main">
      <p id="notice" class="notice" role="status" aria-live="polite"></p>
