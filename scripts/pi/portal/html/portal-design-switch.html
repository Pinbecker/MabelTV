<section class="portal-design-settings settings-section surface full" aria-labelledby="portalDesignTitle">
  <p class="section-kicker">Portal appearance</p>
  <div class="portal-design-heading">
    <div><h2 id="portalDesignTitle">Choose this portal’s design</h2><p>The new Experience stays the default. Classic is the complete previous portal, kept here as a familiar alternative.</p></div>
    <span class="portal-design-device">This device</span>
  </div>
  <div class="portal-design-options" role="group" aria-label="Portal design">
    <button type="button" class="portal-design-option" data-portal-design="experience" aria-pressed="false">
      <span class="portal-design-preview experience" aria-hidden="true"><span class="preview-brand"></span><span class="preview-hero"></span><span class="preview-dock"></span></span>
      <span class="portal-design-copy"><strong>Experience <small>Default</small></strong><span>Streaming-first design and the direction MabelTV will continue in.</span></span>
      <span class="portal-design-check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m6 12 4 4 8-9"/></svg></span>
    </button>
    <button type="button" class="portal-design-option" data-portal-design="classic" aria-pressed="false">
      <span class="portal-design-preview classic" aria-hidden="true"><span class="preview-rail"></span><span class="preview-grid"></span></span>
      <span class="portal-design-copy"><strong>Original portal</strong><span>The exact previous core portal, without the retired experimental themes.</span></span>
      <span class="portal-design-check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m6 12 4 4 8-9"/></svg></span>
    </button>
  </div>
  <p class="portal-design-note">Switching reloads the portal. Your library, settings, downloads and playback history are shared by both designs.</p>
</section>
