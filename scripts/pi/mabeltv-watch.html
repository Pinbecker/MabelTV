<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050706">
  <title>Watch · __TV_NAME__</title>
  <style>
    :root{color-scheme:dark;--accent:#ff7559;--muted:#99a39f;--line:#29312e;font-family:"Segoe UI Variable","Segoe UI",-apple-system,BlinkMacSystemFont,Arial,sans-serif}*{box-sizing:border-box}html,body{min-height:100%;margin:0;background:#050706;color:#f6f7f6}body{display:grid;place-items:center}button,a{font:inherit}.player-page{width:100%;min-height:100vh;display:flex;flex-direction:column}.player-head{height:72px;display:flex;align-items:center;gap:16px;padding:0 clamp(16px,4vw,46px);border-bottom:1px solid var(--line);background:#090c0b}.back{width:42px;height:42px;display:grid;place-items:center;border:1px solid #303936;border-radius:50%;background:transparent;color:#fff;text-decoration:none;font-size:1.2rem}.player-title{min-width:0;flex:1}.player-title strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.player-title small{color:var(--muted)}.player-head #startOver{min-height:38px;flex:0 0 auto;border:1px solid #323b37;border-radius:8px;padding:8px 13px;background:#161d1a;color:#fff}.player-stage{min-height:0;flex:1;display:grid;place-items:center;padding:clamp(14px,3vw,38px)}.cabinet{position:relative;width:min(1280px,100%);padding:clamp(9px,2vw,23px);border:clamp(8px,1.5vw,18px) solid #151a18;border-radius:20px;background:#020303;box-shadow:inset 0 0 0 2px #4b5551,0 28px 90px #000}.cabinet:after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:inherit;background:repeating-linear-gradient(0deg,#fff0 0 3px,#0002 4px 5px);opacity:var(--crt,.25);mix-blend-mode:multiply}.cabinet.my-tv{padding:0;border:0;border-radius:0;box-shadow:none}.cabinet.my-tv:after{display:none}.cabinet video{display:block;width:100%;max-height:calc(100vh - 100px);aspect-ratio:16/9;background:#000;object-fit:contain}.cabinet.distortion video{transform:scale(1.006);filter:contrast(1.03) saturate(1.03)}.cabinet video:fullscreen,.cabinet video:-webkit-full-screen{width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important;border:0!important;outline:0!important;box-shadow:none!important;background:#000!important;object-fit:contain!important;transform:none!important;filter:none!important}.state{max-width:620px;text-align:center}.state h1{margin:0 0 10px;font-size:clamp(1.6rem,4vw,3rem)}.state p{margin:0 0 22px;color:var(--muted)}.state button{min-height:48px;border:0;border-radius:10px;padding:11px 20px;background:#fff;color:#111614;font-weight:750}.error{color:#ff9c88}@media(max-width:720px){.player-head{height:58px;padding:0 12px;gap:9px}.back{width:36px;height:36px}.player-head #startOver{min-height:32px;padding:5px 8px;font-size:.75rem}.player-stage{padding:0}.cabinet{width:100%;padding:0;border:0;border-radius:0;box-shadow:none}.cabinet:after{border-radius:0}.cabinet video{max-height:calc(100vh - 58px);aspect-ratio:auto}}
  </style>
</head>
<body data-tv-name="__TV_NAME__">
  <main class="player-page">
    <header class="player-head"><a id="back" class="back" href="/#watch" aria-label="Back to library">←</a><div class="player-title"><strong id="title">Preparing player…</strong><small id="detail">Secure remote viewing</small></div><button id="startOver" type="button" hidden>Start over</button></header>
    <section id="stage" class="player-stage"><div id="loading" class="state"><h1>Getting things ready…</h1><p>Connecting securely to your TV library.</p></div><div id="cabinet" class="cabinet" hidden><video id="video" controls playsinline webkit-playsinline preload="metadata"></video></div><div id="error" class="state error" hidden><h1>Couldn’t start this video</h1><p id="errorText"></p><button id="retry" type="button">Try again</button></div></section>
  </main>
  <script>
    const $ = selector => document.querySelector(selector)
    const query = new URLSearchParams(location.search)
    $('#back').href = '/#watch'
    let session = null
    let saveTimer = null
    let heartbeatTimer = null
    let lastSaved = -1
    let ready = false
    let sequence = 0
    let serverOffset = 0
    let libraryId = ''
    const writer = Array.from(crypto.getRandomValues(new Uint8Array(16)), value => value.toString(16).padStart(2, '0')).join('')

    async function api(path, options = {}) {
      const response = await fetch(path, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, signal: AbortSignal.timeout(10000), ...options })
      const body = await response.json().catch(() => ({}))
      if (!response.ok) { const error = new Error(body.error || 'The TV could not complete that request'); error.code = body.code; throw error }
      return body
    }

    function payload() {
      const kind = query.get('kind') || ''
      return ['my_tv', 'my-tv-series'].includes(kind) ? { kind, file: query.get('file') || '', ...(kind === 'my-tv-series' ? { series: query.get('series') || '' } : {}), ...(query.has('position') ? { position: Number(query.get('position')) } : {}) }
        : { kind: 'channel', channel: Number(query.get('channel')), file: query.get('file') || '' }
    }

    function showError(message) {
      $('#loading').hidden = true; $('#cabinet').hidden = true; $('#error').hidden = false; $('#errorText').textContent = message
    }

    async function start() {
      ready = false; clearInterval(saveTimer); clearInterval(heartbeatTimer)
      $('#error').hidden = true; $('#cabinet').hidden = true; $('#loading').hidden = false
      try {
        let result
        try { result = await api('/api/remote/start', { method: 'POST', body: JSON.stringify(payload()) }) }
        catch (error) {
          if (error.code !== 'tv-active' || !confirm(`${document.body.dataset.tvName} is playing at home. Stop it and watch here instead?`)) throw error
          await api('/api/remote/stop-tv', { method: 'POST', body: '{}' })
          await new Promise(resolve => setTimeout(resolve, 900))
          result = await api('/api/remote/start', { method: 'POST', body: JSON.stringify(payload()) })
        }
        session = new URL(result.stream_url, location.origin).searchParams.get('stream')
        libraryId = result.library_id || ''; serverOffset = (result.server_time || Date.now() / 1000) - Date.now() / 1000
        $('#cabinet').classList.toggle('my-tv', ['my_tv', 'my-tv-series'].includes(result.kind))
        const tvName = result.tv_name || 'Your TV'
        document.title = `${result.title} · ${tvName}`; $('#title').textContent = result.title
        $('#detail').textContent = `${tvName} remote viewing`
        const video = $('#video'); video.replaceChildren()
        // Register media handlers before assigning the source/loading.  On
        // iOS a cached/fast metadata response can otherwise arrive before the
        // handler exists, leaving the native player stuck in its error state.
        const resume = Number(result.resume_position || 0)
        video.onloadedmetadata = () => { if (resume > 0 && resume < video.duration - 5) video.currentTime = resume; ready = true; if (query.get('position') === '0') void savePosition(false, true) }
        video.onerror = () => {
          const detail = video.error ? ` (media error ${video.error.code})` : ''
          showError(`This video could not be played on this device${detail}. Try again.`)
        }
        video.src = result.stream_url
        if (result.subtitle_url) { const track = document.createElement('track'); track.kind = 'subtitles'; track.srclang = 'en'; track.label = 'English'; track.src = result.subtitle_url; video.append(track) }
        video.load()
        $('#startOver').hidden = resume <= 10
        let fullscreenStarted = false
        video.onplay = () => {
          if (!fullscreenStarted && video.webkitEnterFullscreen) {
            fullscreenStarted = true
            video.webkitEnterFullscreen()
          }
        }
        video.onpause = () => savePosition(false, true); video.onseeked = () => savePosition(false, true); video.onended = () => savePosition(true, true)
        $('#loading').hidden = true; $('#cabinet').hidden = false
        clearInterval(saveTimer); saveTimer = setInterval(savePosition, 5000)
        clearInterval(heartbeatTimer); heartbeatTimer = setInterval(() => api('/api/remote/heartbeat', { method: 'POST', body: JSON.stringify({ stream: session }) }).catch(() => {}), 30000)
        // The library card click is no longer a user gesture after navigating
        // to this dedicated page. Calling play() here makes iOS reject the
        // stream and show its crossed-out play control. Let the native
        // control start playback from the user's tap instead.
      } catch (error) { showError(error.message) }
    }

    function checkpoint(finished = false) {
      const video = $('#video')
      return { source: { ...payload(), library_id: libraryId }, writer, sequence: ++sequence,
        observed_at: Date.now() / 1000 + serverOffset, position: video.currentTime,
        duration: Number.isFinite(video.duration) ? video.duration : 0, finished: finished || video.ended,
        stream: session }
    }
    async function savePosition(finished = false, force = false) {
      const video = $('#video')
      if (!ready || !session || !Number.isFinite(video.currentTime)
          || (!finished && !force && Math.abs(video.currentTime - lastSaved) < 5)) return
      const sample = checkpoint(finished)
      try {
        await api(libraryId && ['my_tv', 'my-tv-series'].includes(payload().kind)
          ? '/api/my-tv/progress' : '/api/remote/position', { method: 'POST', body: JSON.stringify(sample) })
        lastSaved = sample.position
      } catch (_) { $('#detail').textContent = 'Progress is waiting to sync · reconnect to save your place' }
    }
    function release() {
      if (!session || !ready) return
      const sample = checkpoint()
      navigator.sendBeacon?.(libraryId && ['my_tv', 'my-tv-series'].includes(payload().kind)
        ? '/api/my-tv/progress' : '/api/remote/position', new Blob([JSON.stringify(sample)], { type: 'application/json' }))
      navigator.sendBeacon?.('/api/remote/release', new Blob([JSON.stringify({ stream: session })], { type: 'application/json' }))
    }

    $('#retry').onclick = start
    $('#startOver').onclick = () => { const video = $('#video'); video.currentTime = 0; lastSaved = 0; video.play().catch(() => {}); $('#startOver').hidden = true }
    addEventListener('pagehide', release)
    start()
  </script>
</body>
</html>
